name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # #1771 S2: manueller Vermessungslauf des Filter-A-Pools statt der Positivliste.
  workflow_dispatch:
    inputs:
      e2e_vermessung:
        description: "E2E-Vermessungsmodus: Filter-A-Kandidatenpool statt Positivliste fahren"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Install Playwright-Browser (tests/visual Pixel-Diff)
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        # #1196 (PR #1497): Abbau der Pauschal-Ignores.
        #
        # 1) Egress-Waechter (#1337-Zielbild): pytest-socket blockt jeden
        #    externen Netzzugriff; lokale Test-Server (localhost) und Unix-
        #    Sockets (asyncio-Self-Pipes) bleiben erlaubt. Ein Kern-Test, der
        #    externes Netz braucht, faellt damit per Bauart auf (Test-Politik:
        #    Kern ohne Netz/Live-Dienste) — und ein versehentlicher Echt-
        #    Versand (#1477-Klasse) ist auf dem Runner strukturell unmoeglich.
        #
        # 2) tests/tdd/ laeuft jetzt MIT (5472 Tests, vorher komplett blinder
        #    Fleck) — ausgenommen die in .github/ci_tdd_excludes.txt
        #    vermessenen offline-roten Dateien (Ratsche: Liste darf nur
        #    schrumpfen, neue tdd-Dateien laufen automatisch mit).
        #    tests/refactor/ und die 7 frueher einzeln ignorierten unit-
        #    Dateien laufen wieder mit (2026-08-04 gruen nachgemessen).
        #
        # 3) tests/red/ bleibt draussen: RED-Artefakt-Ablage des TDD-
        #    Workflows, kein Kern-Bestand.
        #
        # 4) Log-Volumen (2026-08-06): kein -v mehr — das waren ~6.700
        #    Zeilen "PASSED" pro Lauf, die jede Fehleranalyse (Mensch wie
        #    KI-Agent) durchkaemmen musste. addopts liefert -q; dazu:
        #    --tb=short (kompakte Tracebacks) und -rfE (Fehlschlag-Kurzliste
        #    ans Log-ENDE). Bei Bedarf volles Log lokal reproduzierbar.
        run: |
          TDD_EXCLUDES=$(grep -v '^#' .github/ci_tdd_excludes.txt | sed 's/^/--ignore=/' | tr '\n' ' ')
          uv run pytest \
            --disable-socket --allow-unix-socket \
            --allow-hosts=127.0.0.1,::1,localhost \
            --ignore=tests/red/ \
            $TDD_EXCLUDES \
            --tb=short -rfE

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Go tests
        run: go test ./...

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Die LIVE-Katalog-Drift-Waechter (#1351 F003, #1424 AC-2, corridorMark)
      # lesen den echten Backend-Katalog via `uv run python3` — ohne uv+Sync
      # scheiterten genau diese 6 Tests seit jeher nur auf dem Runner (#1196).
      - name: Install uv (fuer LIVE-Katalog-Drift-Waechter)
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python + Projekt-Abhaengigkeiten
        working-directory: .
        run: |
          uv python install 3.12
          uv sync
      - name: Run frontend unit tests
        # Log-Volumen (2026-08-06): TAP-Volllog (~17k Zeilen) NICHT mehr auf
        # stdout — bei Erfolg nur die Summary, bei Fehlschlag die Kurzliste
        # der "not ok"-Zeilen mit Kontext. Das Volllog bleibt im Schritt
        # reproduzierbar (npm test lokal), die CI-Analyse liest nur noch das
        # Wesentliche (#1196-Folge).
        run: |
          npm test > /tmp/fe-test.log 2>&1 && {
            echo "=== OK — Summary ==="
            grep -E "^# (pass|fail|tests|duration)" /tmp/fe-test.log || tail -5 /tmp/fe-test.log
          } || {
            echo "=== FEHLGESCHLAGENE TESTS (Kurzliste) ==="
            grep -nE "^\s*not ok" /tmp/fe-test.log | head -40
            echo "=== Kontext (letzte 60 Zeilen) ==="
            tail -60 /tmp/fe-test.log
            exit 1
          }

  svelte-check:
    # Baseline-Gate (Issue #1018): darf nur "nicht schlechter werden".
    # Hart auf 0 Fehler erst nach Frontend-Bereinigung (Roadmap Phase 3.2).
    # Bei Verbesserung: Baseline-Werte hier absenken.
    runs-on: ubuntu-latest
    env:
      # Abgesenkt 2026-08-04 (#1196): 70/171 -> 36/141 nach Typ-Drift-Bereinigung
      # der Compare-Editor-Tests + Entfernung toter CSS-Regeln in CompareTabs.
      # Abgesenkt 2026-09-19 (#2276 S4): 141 -> 132 Warnings (Wegfall der zwei
      # historischen Wrapper-Divs im Wetter-Metriken-Reiter, Errors unveraendert
      # bei 36 — die zwei neuen Kern-Test-Fehler kamen von einem fehlenden
      # `as unknown as`-Bruecken-Cast, gefixt statt die Baseline anzuheben).
      # Abgesenkt 2026-09-24 (#2276 S6g, AC-10): 36 -> 34 Errors — `localSchedule`
      # in CompareTabs.svelte wird vor seine erste Nutzung gezogen (behebt beide
      # "used before its declaration"/"used before being assigned"-Fehler auf
      # derselben Zeile in einem Aufwasch).
      BASELINE_ERRORS: 34
      BASELINE_WARNINGS: 132
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: svelte-check gegen Baseline
        run: |
          OUT=$(npx svelte-check --tsconfig ./tsconfig.json --output machine 2>&1) || true
          SUMMARY=$(echo "$OUT" | grep ' COMPLETED ' | tail -1)
          echo "$SUMMARY"
          [ -n "$SUMMARY" ] || { echo "FEHLER: svelte-check lieferte keine COMPLETED-Zeile."; echo "$OUT" | tail -20; exit 1; }
          ERRORS=$(echo "$SUMMARY" | awk '{for(i=1;i<=NF;i++) if($i=="ERRORS") print $(i-1)}')
          WARNINGS=$(echo "$SUMMARY" | awk '{for(i=1;i<=NF;i++) if($i=="WARNINGS") print $(i-1)}')
          echo "Ist: $ERRORS Fehler / $WARNINGS Warnings — Baseline: $BASELINE_ERRORS / $BASELINE_WARNINGS"
          FAIL=0
          [ "$ERRORS" -le "$BASELINE_ERRORS" ] || { echo "FEHLER: $ERRORS Fehler > Baseline $BASELINE_ERRORS"; FAIL=1; }
          [ "$WARNINGS" -le "$BASELINE_WARNINGS" ] || { echo "FEHLER: $WARNINGS Warnings > Baseline $BASELINE_WARNINGS"; FAIL=1; }
          if [ "$ERRORS" -lt "$BASELINE_ERRORS" ] || [ "$WARNINGS" -lt "$BASELINE_WARNINGS" ]; then
            echo "HINWEIS: Besser als Baseline — BASELINE_ERRORS/BASELINE_WARNINGS in ci.yml absenken."
          fi
          exit $FAIL

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Run ruff check
        run: uv run ruff check src/ tests/

  # #1771 S2: eigener PARALLELER Job (kein `needs:`, AC-1) -- eigener,
  # isolierter Stack (Python-Core + Go-Server, Fixtures, leere Datenwurzel)
  # gegen die Positivliste .github/ci_e2e_specs.txt.
  # Details: docs/specs/modules/fix_1771_s2_playwright_ci_ampel.md
  e2e:
    runs-on: ubuntu-latest
    env:
      # Werte belegt gegen den isolierten Stack (Ports 8095/8005), zuletzt
      # nachgemessen am 2026-08-14 (#1771 S3 Block B, Listenwachstum auf 45
      # Dateien nach der Einzelfall-Diagnose der 11 Ein-Fehler-Dateien),
      # Filter B im ZIELVERBUND: 3 Zyklen hintereinander, je frischer Stack
      # (der Login-Limiter ist prozess-intern), jeweils identisch
      #   Hauptlauf (44 Dateien):   expected=224, unexpected=0, skipped=0
      #   Zweitlauf (nur bug-703):  expected=3,   unexpected=0, skipped=0
      # 224 = 223 Testfaelle in 44 Dateien + 1x global.setup (F008-Klarstellung
      # im Kopf von ci_e2e_specs.txt). Vorstand vor Block B: 38 Dateien / 173.
      # E2E_MIN_SPECS = Zeilenzahl der Positivliste (45) -- die Gleichheit
      # bewacht tests/unit/test_e2e_positivliste_ratschen_bindung.py, damit
      # eine wachsende Liste die Schwelle nicht stehen laesst (F006).
      #
      # Beide E2E_MIN_EXECUTED_* sind EXAKT die belegten Werte, KEIN Puffer
      # nach unten (Adversary-Fund F006, #1771 S2 Runde 2). Ein Puffer wie
      # zuvor (170) ist selbst das Loch: 15 der Listen-Dateien haben <=3
      # Testfaelle -- verschwindet eine davon klaglos vom Dateisystem
      # (Umbenennung/Loeschung/Merge-Verlust), OHNE dass die Liste geaendert
      # wird, faellt `expected` exakt auf 170 und ein Puffer von 3 haette das
      # NICHT gefangen (live nachgemessen mit e2e/font-weights.spec.ts).
      # Mehr Tests (neue Faelle in bereits gelisteten Dateien) erfuellen
      # `expected >= E2E_MIN_EXECUTED` weiterhin; weniger sollen blockieren.
      # Die eigentliche Zusicherung gegen verschwundene Dateien traegt NICHT
      # diese Zahl allein, sondern der Existenzpruefungs-Schritt weiter
      # unten (vor dem Playwright-Lauf).
      #
      # 🔴 MEHRERE Playwright-Aufrufe, deshalb mehrere Schwellen (#1771 S3).
      # bug-703-login-ratelimit.spec.ts feuert absichtlich 32 Logins ab
      # (frontend/e2e/bug-703-login-ratelimit.spec.ts:27, BURST + 2) und
      # verbraucht damit das IP-Limit aus internal/router/router.go:45
      # (NewIPRateLimiter(30, time.Hour)) fuer den ganzen Job. Playwright
      # sortiert Dateien ALPHABETISCH (unabhaengig von der CLI-Reihenfolge);
      # bug-703 liegt auf Position 3 von 49 (48 Listen-Dateien + global.setup;
      # vor Block B waren es 3 von 39). Jede spaeter laufende Datei mit
      # EIGENEM Login laeuft danach in "Login B fehlgeschlagen: 429" -- also
      # ausgerechnet die zwei Mandantentrennungs-Tests, die diese Scheibe
      # aufnimmt. Die uebrigen Listen-Dateien merken nichts davon, weil sie
      # den gespeicherten Anmeldezustand (storageState) wiederverwenden.
      # A/B nachgemessen am 2026-08-14 im damaligen Zielverbund, gleicher
      # Stack, gleiche 38 Dateien -- einziger Unterschied die Aufteilung:
      #   EIN Aufruf (38 Dateien):  expected=173, unexpected=2
      #     beide Roten woertlich "Login B fehlgeschlagen: 429"
      #   GETEILT (37 + 1, 3 Zyklen): expected=173/3, unexpected=0/0
      # Die Aufteilung ist damit gemessen, nicht Geschmack -- NICHT wieder zu
      # einem Aufruf zusammenlegen, ohne diese Messung zu wiederholen. Die
      # sieben in Block B ergaenzten Dateien aendern daran nichts: sie nutzen
      # alle den storageState (login() in helpers.ts:97-106 kehrt sofort
      # zurueck, wenn die Sitzung schon steht), holen sich also keinen
      # eigenen Login -- nachgemessen in denselben 3 Zyklen, 0 unexpected.
      # Weil bug-703 das Kontingent fuer die restliche Stunde leerfaehrt und
      # es innerhalb eines Jobs nicht wieder aufgefuellt wird, laeuft dieser
      # Aufruf ZULETZT -- siehe Reihenfolge-Absatz beim PWA-Aufruf.
      #
      # 🔴 ZWEITER Aufruf ab #2128: die PWA-Strecke (`--project=pwa`).
      # Sie laeuft NICHT ueber die Positivliste, sondern ueber die feste
      # Projektzuordnung in frontend/playwright.config.ts. Zwei unabhaengige
      # Gruende, beide zwingend:
      #   1) Ratschen-Filter A (docs/reference/gates_und_ratschen.md,
      #      "e2e-Ratsche") schliesst jede Datei mit `waitForTimeout` aus.
      #      pwa-update-und-abmelden.spec.ts hat 11 solcher Stellen,
      #      pwa-grundausstattung.spec.ts 2, pwa-offline-sperre-und-mandant.spec.ts
      #      2, pwa-offline-ansicht-mit-stand.spec.ts 1, pwa-update-erkennung.spec.ts
      #      (Issue #2316) 7 -- sie sind dort unvermeidbar (Nachlauf-Beobachtung:
      #      "die Seite hat NICHT nochmal neu geladen", "der wartende Worker
      #      hat NICHT uebernommen" -- ein Ausbleiben laesst sich nicht
      #      erwarten, nur abwarten). Aufnahme in die Positivliste waere ein
      #      Ratschen-Verstoss.
      #   2) Alle fuenf Dateien brauchen `serviceWorkers: 'allow'`. Das ist eine
      #      PROJEKT-Einstellung; die Bestandsstrecke laeuft bewusst mit
      #      'block' (AC-16), damit der seit #2128 auf jeder Seite
      #      registrierte Worker ihr Verhalten nicht veraendert.
      # Der Schutz gegen "Datei verschwindet klaglos" haengt hier nicht an der
      # Existenzpruefung der Liste, sondern an E2E_MIN_EXECUTED_PWA: faellt
      # eine der fuenf Dateien weg, sinkt `expected` unter 61 und das Gate
      # wird rot.
      #
      # 🔴 REIHENFOLGE IST KRITISCH: PWA VOR bug-703 (gemessen 2026-09-06).
      # Frueher lief die PWA-Strecke zuletzt, mit der Begruendung, sie hole
      # sich gar keinen eigenen Login (global.setup ueberspringt ihn bei
      # gueltiger playwright/.auth/admin.json). Das war falsch und hat die
      # Ampel rot gemacht: die PWA-Strecke widerruft in "AC-11: Auf allen
      # Geraeten abmelden" ABSICHTLICH alle Sitzungen -- also auch die in
      # admin.json -- und stellt sie im datei-eigenen `test.afterAll`
      # (pwa-update-und-abmelden.spec.ts) mit GENAU EINEM echten Login wieder
      # her, damit spaetere Aufrufe nicht in den Auth-Guard laufen. Lief
      # bug-703 davor, war das IP-Kontingent (30/Stunde,
      # internal/router/router.go:45) leer und dieser eine Login lief in 429;
      # Playwright haengt den Hook-Fehler an das zuletzt gelaufene Ergebnis
      # desselben Workers -- gemeldet wurde also ein roter Testfall, der
      # selbst gar nichts damit zu tun hatte. Innerhalb einer Stunde fuellt
      # sich das Kontingent nicht wieder auf, ein Retry hilft nicht.
      # bug-703 selbst haengt an KEINEM Vorlauf (sein Kopfkommentar fordert
      # nur AC-3 vor AC-2 INNERHALB der Datei, per test.describe.serial) --
      # er muss nur ZULETZT laufen.
      E2E_MIN_SPECS: 60     # Ratsche: Zahl DATEIEN auf der Positivliste -- EXAKT, nicht mindestens (Kern-Test). 57 = 48 + mobile-bottom-nav-floating (Mobile-Shell S1) + mobile-konto-sheet (S2) + compare-alarme-speichert-selbst (#2276 S2) + compare-wertebereiche-speichert-selbst (#2276 S3) + compare-wetter-metriken-speichert-selbst (#2276 S4) + compare-versand-speichert-selbst (#2276 S5) + compare-stundenverlauf-wertprops (#2276 S6b) + compare-alarme-wertprops (#2276 S6c) + systemhinweise-unter-konto-sheet (#2370) + compare-wertebereiche-wertprops (#2276 S6d). Zusammenfuehrung der Ratschen aus #2373 und #2276-Kette beim Merge-Konflikt: 51 (Merge-Basis vor beiden Straengen) + 1 (#2370) + 5 (#2276 S3-S6c) = 57, per direkter Zeilenzaehlung der Positivliste gegengeprueft. 58 = 57 + 1 (#2276 S6d, Rebase auf #2373 am 2026-09-22). 59 = 58 + compare-konfliktschutz-zwei-kontexte (#2375). 60 = 59 + kurzform-gefuehlte-temperatur-kind-mitnahme (Bug #2454) -- Rebase auf origin/main (3cb47e5e) am 2026-09-30, Zusammenfuehrung der Ratschen aus #2375 und Bug #2454 beim Merge-Konflikt: per direkter Zeilenzaehlung von `.github/ci_e2e_specs.txt` (`grep -c '^e2e/'`) gegengeprueft. 58 = 60 - 2 (PR #2495, Mobile-Usability F5: issue-951-sheet-bottomnav + mobile-editor-controls-viewport ersatzlos gestrichen, Speclist gepflegt). 59 = 58 + konto-loeschdialog-mobil-ueberlauf (#2160 Fix-Loop), Rebase auf origin/main nach PR #2495 am 2026-10-04, per `grep -c '^e2e/'` gegengeprueft. 60 = 59 + trip-hub-kopf-region-aktivitaet (#2284 S2), Merge origin/main in #2284 S2 am 2026-10-04 (HEAD-Zweig hatte 61 inkl. der zwei von PR #2495 gestrichenen Dateien -- ueberholt), per `grep -c '^e2e/'` gegengeprueft.
      E2E_MIN_EXECUTED_HAUPT: 338      # Hauptlauf: 59 Dateien + global.setup -- exakt belegt, kein Puffer. 287 = 255 (Merge-Basis, Stand #2276 S2: 252 + 3) + 6 (systemhinweise-unter-konto-sheet, #2370: 4 Faelle + AC-2 x2 Viewports) + 26 (#2276 S3-S6c: 281 - 255, aus den beiden Zweig-Endstaenden 261/#2370 bzw. 281/#2276-S6c hergeleitet). Zusammenfuehrung der Ratschen aus #2373 und #2276-Kette beim Merge-Konflikt 2026-09-22 -- erste Bestaetigung durch den CI-Hauptlauf auf diesem PR: weicht die Zahl ab, meldet `e2e` das rot, bevor etwas nach `main` geht. 291 = 287 + 4 (compare-wertebereiche-wertprops, #2276 S6d: per `npx playwright test --list` 5 gelistete Faelle minus global.setup), Rebase auf #2373 am 2026-09-22 -- erste Bestaetigung durch den CI-Hauptlauf auf dem PR. Zusammenfuehrung der Ratschen aus #2375 und Bug #2454 beim Merge-Konflikt 2026-09-30 -- NICHT arithmetisch aus den beiden Zweig-Endstaenden addiert, sondern direkt am zusammengefuehrten Stand nachgemessen: `npx playwright test --list` ueber die vollstaendige Hauptlauf-Auswahl (Positivliste ohne bug-703, 59 Dateien) liefert 317 Faelle (inkl. global.setup) -- erste Bestaetigung durch den CI-Hauptlauf auf diesem PR. 304 = 317 - 13 (PR #2495: `npx playwright test --list` ueber die zwei gestrichenen Speclist-Dateien = 13 Faelle, nachgemessen am 2026-10-03; Setup-Zaehler bleibt im Hauptlauf enthalten). 306 = 304 + 2 (konto-loeschdialog-mobil-ueberlauf, #2160 Fix-Loop: 2 Faelle; vor dem Rebase 317 + 2 = 319 im Zielverbund 3x nachgemessen) -- erste Bestaetigung durch den CI-Hauptlauf auf dem PR. 334 = 306 + 28 (trip-hub-kopf-region-aktivitaet, #2284 S2): Merge origin/main in #2284 S2 am 2026-10-04 -- NICHT aus den Zweig-Endstaenden addiert (HEAD 337 enthielt die von PR #2495 gestrichenen Faelle), sondern direkt nachgemessen: `npx playwright test --list` ueber die 59 Hauptlauf-Dateien (Positivliste ohne bug-703) liefert `Total: 334 tests in 60 files` (inkl. global.setup). 338 = 334 + 4 (RED v1.3 #2284 S2: AC-13 jetzt 3 Faelle statt 1 + AC-18 vier Faelle minus entfallene Altfaelle, direkt per `npx playwright test --list` ueber die 59 Hauptlauf-Dateien nachgemessen: `Total: 338 tests in 60 files`), am Stand fc64d04a1 nachgemessen.
      E2E_MIN_EXECUTED_PWA: 61         # Zweitlauf: 60 Faelle in 5 PWA-Dateien (Issue #2316: pwa-update-erkennung.spec.ts neu; Issue #2317: +1 Fall AC-6 dort, statisch aus --list abgeleitet) + global.setup -- kein Puffer
      E2E_MIN_EXECUTED_RATELIMIT: 3    # Drittlauf: bug-703 (2 Faelle) + global.setup -- exakt belegt, kein Puffer
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go-Server bauen
        run: go build -o /tmp/gregor-server ./cmd/server
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python + Projekt-Abhaengigkeiten
        run: |
          uv python install 3.12
          uv sync
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend-Abhaengigkeiten + Playwright-Browser Node (NEU, unabhaengig vom Python-Playwright im `test`-Job)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Spec-Auswahl bestimmen (Positivliste vs. Vermessungsmodus)
        id: specs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.e2e_vermessung }}" = "true" ]; then
            echo "mode=vermessung" >> "$GITHUB_OUTPUT"
            echo "Vermessungsmodus: verschaerfter Filter-A-Kandidatenpool (kein waitForTimeout/test.skip/test.fixme/describe.skip, ohne .staging.spec.ts, ohne hartkodierten Hauptrepo-Pfad, ohne __dirname)."
            # F007 (#1771 S2 Runde 2): die reine waitForTimeout/test.skip/test.fixme-
            # Bedingung liefert 105 Dateien -- inklusive der zwei am Code bestaetigt
            # strukturell kaputten (list-routes-btn-migration.spec.ts: hartkodierter
            # Hauptrepo-Pfad /home/hem/gregor_zwanzig, Pfadregel #1409; issue-322-
            # wicon-komponente.spec.ts: __dirname in einem ESM-Modul, deterministischer
            # ReferenceError) sowie einer describe.skip-only-Datei, die von test.skip/
            # test.fixme nicht erfasst wird. Mit allen vier Ausschlusskriterien
            # zusammen (gemessen am 2026-08-13): exakt 87 Dateien -- die Zahl aus
            # Spec/AC-8/ci_e2e_specs.txt-Kopf.
            grep -rLE 'waitForTimeout|test\.skip|test\.fixme|describe\.skip' --include='*.spec.ts' --exclude='*.staging.spec.ts' frontend/e2e > /tmp/e2e-candidates.txt
            : > /tmp/e2e-specs-full.txt
            while IFS= read -r kandidat; do
              grep -qE '/home/hem/gregor_zwanzig|__dirname' "$kandidat" || echo "$kandidat" >> /tmp/e2e-specs-full.txt
            done < /tmp/e2e-candidates.txt
            sed 's#^frontend/e2e/##' /tmp/e2e-specs-full.txt > /tmp/e2e-specs.txt
            # Im Vermessungsmodus wird nicht bewertet -- kein Split noetig.
            cp /tmp/e2e-specs.txt /tmp/e2e-specs-haupt.txt
            : > /tmp/e2e-specs-ratelimit.txt
          else
            echo "mode=positivliste" >> "$GITHUB_OUTPUT"
            echo "Regulaerer Lauf: Positivliste .github/ci_e2e_specs.txt."
            grep -v '^#' .github/ci_e2e_specs.txt | grep -v '^[[:space:]]*$' > /tmp/e2e-specs.txt
            # Aufteilung zur LAUFZEIT (#1771 S3, Begruendung + A/B-Zahlen im
            # env-Block oben): bug-703 verbrennt das Login-Kontingent des
            # ganzen Jobs und laeuft deshalb als eigener, NACHGELAGERTER
            # Aufruf. Die Positivliste selbst bleibt ungeteilt -- an IHR
            # haengen Ratsche, Existenzpruefung und E2E_MIN_SPECS.
            grep -v 'bug-703-login-ratelimit' /tmp/e2e-specs.txt > /tmp/e2e-specs-haupt.txt
            grep 'bug-703-login-ratelimit' /tmp/e2e-specs.txt > /tmp/e2e-specs-ratelimit.txt || true
          fi
          cat /tmp/e2e-specs.txt
      - name: Ratsche -- Mindestzahl Listen-Dateien (E2E_MIN_SPECS)
        if: steps.specs.outputs.mode == 'positivliste'
        run: |
          N=$(wc -l < /tmp/e2e-specs.txt)
          [ "$N" -ge "$E2E_MIN_SPECS" ] || { echo "FEHLER: nur $N Dateien auf der Positivliste, mindestens $E2E_MIN_SPECS gefordert."; exit 1; }
      - name: Existenzpruefung -- jede gelistete Datei muss unter frontend/ existieren
        if: steps.specs.outputs.mode == 'positivliste'
        # F006 Teil 2 (#1771 S2 Runde 2): E2E_MIN_EXECUTED zaehlt nur AUSGEFUEHRTE
        # Testfaelle -- verschwindet eine gelistete DATEI klaglos vom Dateisystem
        # (Umbenennung/Loeschung/Merge-Verlust), OHNE dass die Liste geaendert wird,
        # laeuft `npx playwright test <Liste>` trotzdem durch (Exit 0, weniger
        # Testfaelle). Das ist die eigentliche Zusicherung von AC-7 -- die Testzahl
        # allein kann sie nicht tragen. Deshalb VOR dem Playwright-Lauf: jede
        # nicht-Kommentarzeile der Positivliste muss als Datei existieren, sonst
        # Abbruch mit Nennung der fehlenden Pfade.
        run: |
          FEHLEND=""
          while IFS= read -r rel; do
            [ -f "frontend/$rel" ] || FEHLEND="$FEHLEND$rel"$'\n'
          done < /tmp/e2e-specs.txt
          if [ -n "$FEHLEND" ]; then
            echo "FEHLER: folgende Positivliste-Dateien existieren nicht mehr unter frontend/:"
            echo "$FEHLEND"
            exit 1
          fi
          echo "OK: alle $(wc -l < /tmp/e2e-specs.txt) gelisteten Dateien existieren unter frontend/."
      - name: Isolierten Stack starten (Health-Warteschleifen statt sleep)
        run: bash frontend/e2e/ci-stack.sh start
      - name: Playwright-Specs ausfuehren (Hauptlauf, ohne bug-703)
        working-directory: frontend
        env:
          CI: "1"
        # Leere Auswahl waere KEIN harmloser Leerlauf: `npx playwright test`
        # ohne Argument faehrt den GESAMTEN Korpus (161 Dateien, ~30% rot).
        run: |
          [ -s /tmp/e2e-specs-haupt.txt ] || { echo "FEHLER: Spec-Auswahl fuer den Hauptlauf ist leer."; exit 1; }
          npx playwright test --reporter=json $(cat /tmp/e2e-specs-haupt.txt) > /tmp/e2e-report.json || true
      - name: E2E-Gate auswerten (Hauptlauf, drei Bedingungen, AC-4)
        # F010 (#1771 S2 Runde 3, Adversary MEDIUM): dieser Schritt darf NUR
        # im Positivlisten-Modus streng auswerten. Ohne dieses `if:` wertet
        # auch ein `workflow_dispatch`-Vermessungslauf streng aus (Exit != 0
        # bei Roten) -- Widerspruch zu AC-8: der Vermessungsmodus soll den
        # Filter-A-Kandidatenpool PROTOKOLLIEREN, nicht bewerten. Dort sind
        # rote Tests der erwartete Normalfall (~30% des Bestands), genau
        # deshalb faehrt man den Pool ja. Gleiches Muster wie die Ratsche-
        # und Existenzpruefungs-Schritte oben.
        if: steps.specs.outputs.mode == 'positivliste'
        # Schwelle als echte Shell-Variable durchgereicht (Job-`env` ist im
        # `run`-Shell garantiert gesetzt) statt ueber `${{ env.* }}` -- eine
        # leer aufgeloeste Ausdrucks-Zuweisung waere zwar fail-closed, aber
        # als "Schwelle fehlt" schwer zu deuten.
        run: E2E_MIN_EXECUTED="$E2E_MIN_EXECUTED_HAUPT" python3 .github/scripts/e2e_gate.py /tmp/e2e-report.json
      - name: Playwright-Specs ausfuehren (Zweitlauf, PWA-Strecke --project=pwa)
        # ZWEITER Aufruf, Begruendung ausfuehrlich im env-Block oben:
        # die PWA-Nachweise brauchen `serviceWorkers: 'allow'` (Projekt-
        # Einstellung, nicht per Datei-Argument setzbar) und duerfen wegen
        # Ratschen-Filter A (waitForTimeout) nicht auf die Positivliste.
        # Deshalb Auswahl ueber die feste Projektzuordnung statt ueber eine
        # Dateiliste. Die Bestandsstrecke bleibt davon unberuehrt: Projekt
        # `tests` ignoriert pwa-*.spec.ts, `--project=pwa` beruehrt die
        # Positivliste nicht.
        #
        # 🔴 Reihenfolge VOR dem bug-703-Drittlauf ist KRITISCH, nicht
        # Geschmack -- diese Strecke braucht genau EINEN freien Login.
        # Die frueher hier stehende Begruendung ("global.setup.ts loggt sich
        # bei gueltiger admin.json gar nicht ein, kann also nicht in 429
        # laufen") war falsch: sie beschreibt nur global.setup und uebersieht
        # den datei-eigenen `test.afterAll` in
        # pwa-update-und-abmelden.spec.ts. Der Nachweis "AC-11: Auf allen
        # Geraeten abmelden" widerruft ABSICHTLICH alle Sitzungen -- also
        # auch die in playwright/.auth/admin.json --, und der Hook stellt sie
        # mit einem echten Login wieder her. Lief bug-703 vorher, war das
        # IP-Kontingent (30/Stunde, internal/router/router.go:45) leer, der
        # Login lief in 429 und die Ampel wurde rot (gemessen 2026-09-06:
        # expected=26 unexpected=1, der Hook-Fehler an AC-24 gehaengt).
        # Innerhalb einer Stunde fuellt sich das Kontingent nicht wieder auf.
        # NICHT hinter bug-703 zurueckschieben.
        if: steps.specs.outputs.mode == 'positivliste'
        working-directory: frontend
        env:
          CI: "1"
        # Gleiches Muster wie oben: `|| true` faengt nur den Playwright-
        # Exit-Code ab, damit der Report GESCHRIEBEN wird -- bewertet wird
        # ausschliesslich im naechsten Schritt durch e2e_gate.py (unexpected
        # == 0, skipped == 0, expected >= Schwelle). Ein Fehlschlag macht die
        # Ampel dort wirklich rot; ein fehlender/unlesbarer Report ebenfalls
        # (fail-closed im Gate-Skript).
        run: npx playwright test --project=pwa --reporter=json > /tmp/e2e-report-pwa.json || true
      - name: E2E-Gate auswerten (Zweitlauf, PWA)
        if: steps.specs.outputs.mode == 'positivliste'
        run: E2E_MIN_EXECUTED="$E2E_MIN_EXECUTED_PWA" python3 .github/scripts/e2e_gate.py /tmp/e2e-report-pwa.json
      - name: Playwright-Specs ausfuehren (Drittlauf, nur bug-703)
        # Eigener Aufruf, damit das von bug-703 absichtlich verbrannte
        # Login-Kontingent (30/Stunde je IP) den Hauptlauf nicht mehr
        # erreicht -- A/B-Beleg im env-Block oben. Er laeuft ZULETZT: nach
        # ihm ist das Kontingent fuer die restliche Stunde leer, jeder
        # spaetere echte Login liefe in 429 (siehe PWA-Zweitlauf oben). Die
        # Reihenfolge innerhalb eines Aufrufs liesse sich nicht steuern
        # (Playwright sortiert alphabetisch) -- daher der eigene Aufruf.
        # bug-703 selbst braucht KEINEN Vorlauf: sein Kopfkommentar fordert
        # nur AC-3 vor AC-2 innerhalb der Datei (test.describe.serial).
        if: steps.specs.outputs.mode == 'positivliste'
        working-directory: frontend
        env:
          CI: "1"
        run: |
          [ -s /tmp/e2e-specs-ratelimit.txt ] || { echo "FEHLER: bug-703-login-ratelimit.spec.ts steht nicht mehr auf der Positivliste -- dann sind beide Schwellen neu zu messen und dieser Schritt zu entfernen."; exit 1; }
          npx playwright test --reporter=json $(cat /tmp/e2e-specs-ratelimit.txt) > /tmp/e2e-report-ratelimit.json || true
      - name: E2E-Gate auswerten (Drittlauf, bug-703)
        if: steps.specs.outputs.mode == 'positivliste'
        run: E2E_MIN_EXECUTED="$E2E_MIN_EXECUTED_RATELIMIT" python3 .github/scripts/e2e_gate.py /tmp/e2e-report-ratelimit.json
      - name: Vermessungslauf -- Zusammenfassung (nicht bewertend, AC-8)
        # Gegenstueck zum vorigen Schritt: im Vermessungsmodus wird NICHT
        # bewertet, sondern nur protokolliert -- Kandidatenzahl und die
        # rohen Playwright-Zahlen (expected/unexpected/skipped) als
        # Grundlage fuer kuenftige Erweiterungen von
        # `.github/ci_e2e_specs.txt` (Filter B: 3x hintereinander gruen).
        # Eigener `if:` UND `continue-on-error: true` stellen doppelt
        # sicher, dass dieser Schritt den Job unter keinen Umstaenden rot
        # macht -- auch nicht, wenn der Report unauswertbar sein sollte.
        if: steps.specs.outputs.mode == 'vermessung'
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json

          with open("/tmp/e2e-specs.txt", encoding="utf-8") as f:
              kandidaten = sum(1 for zeile in f if zeile.strip())
          stats = {}
          try:
              with open("/tmp/e2e-report.json", encoding="utf-8") as f:
                  stats = json.load(f).get("stats", {})
          except (OSError, json.JSONDecodeError) as exc:
              print(f"HINWEIS: Report nicht auswertbar ({exc}).")
          print("=== Vermessungslauf-Zusammenfassung (AC-8, NICHT die CI-Ampel) ===")
          print(f"Kandidaten (Filter-A-Pool): {kandidaten} Dateien")
          print(f"expected={stats.get('expected', '?')} "
                f"unexpected={stats.get('unexpected', '?')} "
                f"skipped={stats.get('skipped', '?')}")
          print()
          print("Dieser Lauf dient AUSSCHLIESSLICH der Erweiterung von")
          print(".github/ci_e2e_specs.txt (Filter B: 3x hintereinander gruen).")
          print("Er bewertet NICHT die CI-Ampel -- rote Tests sind hier der")
          print("erwartete Normalfall und machen diesen Schritt bewusst")
          print("NICHT rot.")
          EOF
      - name: Stack stoppen
        if: always()
        run: bash frontend/e2e/ci-stack.sh stop
      - name: Trace-Artefakt hochladen (nur bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: frontend/test-results/
          retention-days: 7

  deploy:
    # C4-71 (#2047 S2): Deploy haengt an allen sechs Ampel-Checks.
    needs: [test, lint, go-test, frontend-test, svelte-check, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # #2047 S2b: zwei Merges liefern nie gleichzeitig aus; ein laufender
    # Deploy wird nie abgebrochen (der naechste reiht sich ein).
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie fuer den Ancestor-Check im Staging-Wait (s. u.).
          fetch-depth: 0
      - name: Warten bis Staging aktuellen Commit hat
        # 2026-08-07 (Deploy-Run zu PR #1566): Der exakte Gleichheits-Check
        # schlug als Fehlalarm fehl, weil Staging im Wartefenster einen
        # NEUEREN main-Commit auslieferte (anderer Merge zwischendurch).
        # Jetzt: ok, sobald der Staging-Commit EXPECTED ENTHAELT
        # (merge-base --is-ancestor). Das frische Fetch pro Versuch ist
        # noetig, weil Staging neuer sein kann als der ausgecheckte Stand.
        run: |
          EXPECTED="${{ github.sha }}"
          BASE="https://staging.gregor20.henemm.com"
          echo "Erwarte Commit ${EXPECTED:0:7} (oder Nachfolger) auf Staging..."
          for i in $(seq 1 12); do
            git fetch -q origin main
            STAGING=$(curl -s "$BASE/api/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('commit',''))" 2>/dev/null || echo "")
            echo "Versuch $i/12: Staging=${STAGING:0:7} Erwartet=${EXPECTED:0:7}"
            if [ -n "$STAGING" ] && git merge-base --is-ancestor "$EXPECTED" "$STAGING" 2>/dev/null; then
              echo "Staging aktuell (enthaelt Erwartet)." && break
            fi
            [ $i -eq 12 ] && echo "FEHLER: Staging nach 6 Min nicht aktuell." && exit 1
            sleep 30
          done

      - name: Smoke-Test Staging
        run: |
          BASE="https://staging.gregor20.henemm.com"
          # Root liegt hinter Basic-Auth (#1030) — mit Creds prüfen, damit der
          # Frontend-Service selbst getestet wird, nicht nur die Auth-Schicht.
          ROOT=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.STAGING_BASIC_AUTH }}" "$BASE/")
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/health")
          echo "ROOT=$ROOT HEALTH=$HEALTH"
          { [ "$ROOT" = "200" ] || [ "$ROOT" = "302" ]; } || { echo "ROOT $ROOT != 200/302"; exit 1; }
          [ "$HEALTH" = "200" ] || { echo "HEALTH $HEALTH != 200"; exit 1; }
          echo "Staging Smoke: OK"

      # #2047 Scheibe 2: Die CI schreibt KEINEN Staging-Nachweis mehr und resettet
      # den Haupt-Checkout nicht. Sie liefert nur aus, wenn fuer origin/main bereits
      # ein echter /e2e-verify-Nachweis vorliegt (oder der Stand docs-only ist).
      # Einmal pruefen, nicht warten: /e2e-verify laeuft nach dem Merge laenger als
      # dieser Job — der Normalfall ist /70-deploy Schritt 4. Das Skript wird aus
      # origin/main bezogen (Henne-Ei beim ersten Rollout), `mktemp` statt festem
      # /tmp-Pfad (weitere lokale Accounts auf dem Server).
      - name: Prod-Gate pruefen
        id: gate
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          set +e
          OUT=$(ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/hem/gregor_zwanzig && t=\$(mktemp /tmp/ci_prod_gate.XXXXXX) && git fetch origin 2>/dev/null && git show origin/main:scripts/ci_prod_gate.sh > \"\$t\" && bash \"\$t\" /home/hem/gregor_zwanzig; rc=\$?; rm -f \"\$t\"; exit \$rc")
          RC=$?
          set -e
          rm -f /tmp/deploy_key
          echo "$OUT"
          GATE=$(echo "$OUT" | grep -E '^PROD_GATE=(open|closed)$' | tail -n 1 || true)
          if [ "$RC" -ne 0 ] || [ -z "$GATE" ]; then
            echo "::error::Prod-Gate lieferte keine Entscheidung (rc=$RC) — Fetch/Skriptfehler"
            exit 1
          fi
          if [ "$GATE" = "PROD_GATE=open" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prod-Deploy uebersprungen (kein Nachweis)
        if: steps.gate.outputs.open != 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          MSG="Kein /e2e-verify-Nachweis fuer ${SHA} — Prod-Deploy ueber /70-deploy Schritt 4"
          echo "::notice::$MSG"
          echo "### Prod-Deploy uebersprungen" >> "$GITHUB_STEP_SUMMARY"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      # #2047 S2b: Das Deploy-Skript ist idempotent — steht der Stand schon live
      # (z. B. per /70-deploy aus der Session), meldet es "bereits ausgeliefert"
      # und startet nichts neu. Die Ausgabe laeuft live ins Log und wird danach
      # auf genau dieses Literal geprueft (Kopplung mit henemm-infra
      # scripts/deploy-gregor-prod.sh). Der Skript-Exitcode bleibt massgeblich.
      - name: Deploy zu Produktion via SSH
        id: deploy
        if: steps.gate.outputs.open == 'true'
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          LOG=$(mktemp)
          set +e
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "bash /home/hem/henemm-infra/scripts/deploy-gregor-prod.sh" 2>&1 | tee "$LOG"
          EXIT=${PIPESTATUS[0]}
          set -e
          rm -f /tmp/deploy_key
          if grep -qF "bereits ausgeliefert" "$LOG"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$LOG"
          exit $EXIT

      # #2047 S2b: Post-Deploy-Selbsttest auch im CI-Pfad (wie /70-deploy 4b).
      # Exit != 0 macht den Job rot — nichts verschlucken.
      - name: Post-Deploy-Selbsttest Produktion
        if: success() && steps.gate.outputs.open == 'true'
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          set +e
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/hem/gregor_zwanzig && python3 .claude/hooks/prod_selftest.py"
          EXIT=$?
          set -e
          rm -f /tmp/deploy_key
          exit $EXIT

      # Commit-Message NIE per ${{ }} in den Shell-Text interpolieren:
      # Anfuehrungszeichen in der Message (z.B. "Nachtrag 2", 4c9ad35)
      # zerrissen die Zuweisung — beide Notify-Steps rot, Run rot, obwohl
      # der Deploy durch war (Runs 1911–1913, 2026-08-04). Der env-Umweg
      # entschaerft zugleich die Script-Injection ueber Commit-Messages;
      # json.dumps macht jeden Inhalt transportsicher. Nur die erste
      # Message-Zeile — mehr liest auf dem Handy niemand.
      # Drei Meldungen, die sich ausschliessen (#2047 S2b): deployed /
      # bereits ausgeliefert / FEHLGESCHLAGEN; bei geschlossenem Gate keine.
      - name: Telegram — Deploy erfolgreich (HENEMM Server)
        if: success() && steps.gate.outputs.open == 'true' && steps.deploy.outputs.already != 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CHAT_ID: ${{ secrets.HENEMM_DEPLOY_CHAT_ID }}
          SHA: ${{ github.sha }}
        run: |
          BODY=$(python3 - <<'EOF'
          import json, os
          lines = (os.environ.get("COMMIT_MSG") or "").splitlines()
          first = lines[0] if lines else ""
          sha = os.environ["SHA"][:7]
          print(json.dumps({"chat_id": os.environ["CHAT_ID"], "text": "gregor20 deployed: %s %s" % (sha, first)}))
          EOF
          )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.HENEMM_DEPLOY_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null

      - name: Telegram — Stand war schon live (HENEMM Server)
        if: success() && steps.gate.outputs.open == 'true' && steps.deploy.outputs.already == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CHAT_ID: ${{ secrets.HENEMM_DEPLOY_CHAT_ID }}
          SHA: ${{ github.sha }}
        run: |
          BODY=$(python3 - <<'EOF'
          import json, os
          lines = (os.environ.get("COMMIT_MSG") or "").splitlines()
          first = lines[0] if lines else ""
          sha = os.environ["SHA"][:7]
          text = "gregor20 bereits ausgeliefert (kein Neustart): %s %s" % (sha, first)
          print(json.dumps({"chat_id": os.environ["CHAT_ID"], "text": text}))
          EOF
          )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.HENEMM_DEPLOY_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null

      - name: Telegram — Deploy fehlgeschlagen (HENEMM Server)
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CHAT_ID: ${{ secrets.HENEMM_DEPLOY_CHAT_ID }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(python3 - <<'EOF'
          import json, os
          lines = (os.environ.get("COMMIT_MSG") or "").splitlines()
          first = lines[0] if lines else ""
          sha = os.environ["SHA"][:7]
          text = "gregor20 FEHLGESCHLAGEN: %s %s | %s" % (sha, first, os.environ["RUN_URL"])
          print(json.dumps({"chat_id": os.environ["CHAT_ID"], "text": text}))
          EOF
          )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.HENEMM_DEPLOY_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null
