<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<title>Keine Verbindung — Gregor Zwanzig</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f6f4ee" />
		<!--
			Eigenstaendig und ohne jede Abhaengigkeit: kein app.css, keine eigenen
			Schriften. Beides koennte im selben Moment fehlen, in dem diese Seite
			gebraucht wird. Darum Inline-CSS und System-Schriften.
			Issue #2128 (Scheibe 1 zu Epic #2127), AC-4.
		-->
		<style>
			:root {
				--paper: #f6f4ee;
				--card: #ffffff;
				--ink: #1a1a18;
				--ink-muted: #5c5a52;
				--border: #9c9a90;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: var(--paper);
				color: var(--ink);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				line-height: 1.5;
			}
			main {
				width: 100%;
				max-width: 26rem;
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 0.75rem;
				padding: 24px;
				box-shadow: 0 8px 24px rgba(26, 26, 24, 0.16);
			}
			h1 {
				margin: 0 0 12px;
				font-size: 22px;
				line-height: 1.25;
				font-weight: 700;
			}
			p {
				margin: 0 0 20px;
				font-size: 15px;
				color: var(--ink-muted);
			}
			button {
				width: 100%;
				min-height: 44px;
				padding: 0 16px;
				border: none;
				border-radius: 0.5rem;
				background: var(--ink);
				color: var(--paper);
				font: inherit;
				font-size: 15px;
				font-weight: 600;
				cursor: pointer;
			}
			button:focus-visible {
				outline: 3px solid var(--ink);
				outline-offset: 2px;
			}
			/* Issue #2131 — Uebersicht der vorgehaltenen Ansichten. Hoher
			   Kontrast (ADR-0008): der Stand ist eine Entscheidungsgrundlage
			   und darf nicht in einem blassen Grau stehen. */
			.hinweis {
				margin: 0 0 20px;
				padding: 10px 12px;
				border-left: 3px solid #c08a1a;
				background: rgba(192, 138, 26, 0.12);
				color: #6b4a06;
				font-size: 14px;
				font-weight: 600;
			}
			ul.liste {
				list-style: none;
				margin: 0 0 20px;
				padding: 0;
				border-top: 1px solid var(--border);
			}
			ul.liste li {
				border-bottom: 1px solid var(--border);
				padding: 10px 0;
			}
			ul.liste a {
				display: block;
				color: var(--ink);
				font-size: 15px;
				font-weight: 600;
				text-decoration: none;
				min-height: 24px;
			}
			ul.liste a:hover,
			ul.liste a:focus-visible {
				text-decoration: underline;
			}
			ul.liste .stand {
				display: block;
				margin-top: 2px;
				color: #4a4841;
				font-size: 13px;
			}
			p.leer {
				color: #4a4841;
			}
		</style>
	</head>
	<body>
		<main data-testid="offline-uebersicht">
			<h1>Keine Verbindung</h1>
			<p>
				Gregor Zwanzig erreicht gerade das Netz nicht. Die App selbst liegt auf dem Gerät, die
				Inhalte kommen vom Server. Sobald wieder Empfang da ist, lädt die Seite normal.
			</p>
			<!-- Issue #2131 AC-8: das Fehlen der Alarme wird ausdruecklich benannt.
			     Eine leere Stelle waere von „keine Alarme" nicht zu unterscheiden —
			     genau die Ununterscheidbarkeit, die ADR-0034 ausschliesst. -->
			<p class="hinweis" data-testid="offline-alarme-hinweis">
				Alarme sind ohne Netz nicht abrufbar. Was hier fehlt, heißt nicht „keine Warnung“ —
				es heißt „nicht abgefragt“.
			</p>
			<!-- Issue #2131 AC-18: der Service Worker ersetzt diese Marke beim
			     Ausliefern durch die Liste der vorgehaltenen Ansichten. -->
			<!--GZ_LISTE-->
			<button type="button" onclick="location.reload()">Erneut versuchen</button>
		</main>
	</body>
</html>
