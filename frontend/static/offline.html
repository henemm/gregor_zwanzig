<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<title>Keine Verbindung — Gregor Zwanzig</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f6f4ee" />
		<!--
			Eigenstaendig und ohne jede Abhaengigkeit: kein app.css, keine eigenen
			Schriften. Beides koennte im selben Moment fehlen, in dem diese Seite
			gebraucht wird. Darum Inline-CSS und System-Schriften.
			Issue #2128 (Scheibe 1 zu Epic #2127), AC-4.
		-->
		<style>
			:root {
				--paper: #f6f4ee;
				--card: #ffffff;
				--ink: #1a1a18;
				--ink-muted: #5c5a52;
				--border: #9c9a90;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: var(--paper);
				color: var(--ink);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				line-height: 1.5;
			}
			main {
				width: 100%;
				max-width: 26rem;
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 0.75rem;
				padding: 24px;
				box-shadow: 0 8px 24px rgba(26, 26, 24, 0.16);
			}
			h1 {
				margin: 0 0 12px;
				font-size: 22px;
				line-height: 1.25;
				font-weight: 700;
			}
			p {
				margin: 0 0 20px;
				font-size: 15px;
				color: var(--ink-muted);
			}
			button {
				width: 100%;
				min-height: 44px;
				padding: 0 16px;
				border: none;
				border-radius: 0.5rem;
				background: var(--ink);
				color: var(--paper);
				font: inherit;
				font-size: 15px;
				font-weight: 600;
				cursor: pointer;
			}
			button:focus-visible {
				outline: 3px solid var(--ink);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Keine Verbindung</h1>
			<p>
				Gregor Zwanzig erreicht gerade das Netz nicht. Die App selbst liegt auf dem Gerät, die
				Inhalte kommen vom Server. Sobald wieder Empfang da ist, lädt die Seite normal.
			</p>
			<button type="button" onclick="location.reload()">Erneut versuchen</button>
		</main>
	</body>
</html>
