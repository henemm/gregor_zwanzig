<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<title>Gregor Zwanzig</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Schriften kommen seit #2128 aus /fonts (@font-face in app.css) -- kein
		     Aufruf an Google mehr, damit sie auch ohne Netz aus dem Geraetespeicher
		     kommen und unterwegs keine Fremdanfrage noetig ist. -->
		<meta name="theme-color" content="#f6f4ee">
		<!-- Issue #2400 — Dunkles Design VOR dem ersten Paint (kein Hell-Blitz):
		     liest die Geraete-Wahl `gz-dark` und setzt data-theme, color-scheme und
		     theme-color. Ohne gespeicherte Wahl bleibt es hell (kein
		     prefers-color-scheme). #141412 = --g-paper im Dark-Block von app.css.
		     Zur Laufzeit schaltet applyDarkMode() in +layout.svelte dieselben drei. -->
		<script>
			(function () {
				var dunkel = false;
				try {
					dunkel = localStorage.getItem('gz-dark') === '1';
				} catch (e) {
					dunkel = false;
				}
				if (!dunkel) return;
				var root = document.documentElement;
				root.setAttribute('data-theme', 'dark');
				root.style.colorScheme = 'dark';
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', '#141412');
			})();
		</script>
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="default">
		<link rel="icon" href="/favicon.ico" sizes="32x32">
		<link rel="icon" href="/favicon.svg" type="image/svg+xml">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<link rel="manifest" href="/site.webmanifest">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Issue #2131 — Markierung fuer die Stand-Zeile. Der Service Worker
		     ersetzt genau diese Zeile beim ABLEGEN durch die fertig formatierte
		     Stand-Zeile; live ausgeliefert bleibt sie leer und verborgen.
		     Bewusst AUSSERHALB des Hydrierungs-Wurzelknotens: innerhalb wuerde
		     Svelte beim Hydrieren ueber demselben Knoten stehen und der
		     eingeschriebene Stand haenge an einer Uebereinstimmung, die niemand
		     garantiert. -->
		<div id="gz-stand" hidden></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
